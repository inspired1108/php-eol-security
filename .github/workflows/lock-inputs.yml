name: Lock inputs
run-name: Propose inputs.lock.json

# Downloads every external input of the build, records its SHA-256 and checks it
# against the publisher's own digest or signature where one exists. The build
# is not changed: the proposal and its report go to the lock-proposal branch.
# Review them, cross-check from another network
# (python .github/scripts/locked_inputs.py --lock <proposal> verify),
# then commit the proposal as inputs.lock.json.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Same builder commit as build.yml
  BUILDER_SHA: 5f63433eb2bda2ca8d0d970fe487be84f7ab195c

jobs:
  lock:
    runs-on: ubuntu-24.04
    permissions:
      # Only for the lock-proposal branch, pushed by the last step
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Checkout php-windows-builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: php/php-windows-builder
          ref: ${{ env.BUILDER_SHA }}
          path: builder
          persist-credentials: false

      - name: Same builder as build.yml
        run: |
          grep -qx "  BUILDER_SHA: ${BUILDER_SHA}" .github/workflows/build.yml || { echo "::error::BUILDER_SHA differs from build.yml"; exit 1; }

      - name: Propose lock
        run: |
          python3 -I .github/scripts/locked_inputs.py lock \
            --vs-json builder/php/BuildPhp/config/vs.json \
            --out "$RUNNER_TEMP/inputs.lock.json" --report "$RUNNER_TEMP/report.md"

      - name: Summary
        if: always()
        run: |
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY" || true
          {
            echo '### Changes to inputs.lock.json'
            echo '```diff'
            diff -u inputs.lock.json "$RUNNER_TEMP/inputs.lock.json" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload proposal
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inputs.lock.json
          path: ${{ runner.temp }}/inputs.lock.json

      - name: Push proposal to the lock-proposal branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "$RUNNER_TEMP/inputs.lock.json" ] || exit 0
          dir="$RUNNER_TEMP/proposal"
          mkdir "$dir"
          cp "$RUNNER_TEMP/inputs.lock.json" "$RUNNER_TEMP/report.md" "$dir/"
          cd "$dir"
          git init -q -b lock-proposal
          git add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -q -m "Proposed inputs.lock.json from run $GITHUB_RUN_ID (source $GITHUB_SHA)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" lock-proposal
